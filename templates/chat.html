{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-dark text-white fw-bold">Discussion</div>
            <div class="card-body chat-box bg-light" id="chatBox" style="height: 400px; overflow-y: auto;">
                {% for msg in messages %}
                <div class="d-flex mb-3 {% if msg.sender_id == session.user_id %}justify-content-end{% else %}justify-content-start{% endif %}">
                    <div class="p-3 rounded shadow-sm {% if msg.sender_id == session.user_id %}bg-primary text-white{% else %}bg-white text-dark{% endif %}" style="max-width: 75%;">
                        <small class="d-block fw-bold mb-1" style="font-size: 0.75rem;">{{ msg.sender_name }}</small>
                        <span>{{ msg.body }}</span>
                    </div>
                </div>
                {% endfor %}
            </div>
            <div class="card-footer bg-white">
                <div class="input-group">
                    <input type="text" id="messageInput" class="form-control" placeholder="Écrivez votre message...">
                    <button class="btn btn-primary" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function sendMessage() {
    const body = document.getElementById('messageInput').value;
    if (!body.trim()) return;

    fetch('/send-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            conversation_id: {{ conversation_id }}, 
            body: body 
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            location.reload();
        }
    });
}
</script>
{% endblock %}
