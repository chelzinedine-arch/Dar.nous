<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ajouter une annonce - Dar.nous</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

</head>


<body>

<div class="profile-page">

    <div class="profile-container">

        <a href="{{ url_for('dashboard') }}"
           class="profile-back">
            ← Retour au dashboard
        </a>


        <div class="profile-box">

            <h2>
                Déposer une annonce
            </h2>

            <p class="profile-description">
                Ajoutez votre logement sur Dar.nous.
            </p>


            {% if message %}

                <div class="profile-message">
                    {{ message }}
                </div>

            {% endif %}


            <form
                class="profile-form"
                method="POST"
                action="{{ url_for('add_property') }}"
            >


                <div class="profile-field full">

                    <label for="title">
                        Titre *
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Ex: Bel appartement à Agadir"
                        required
                    >

                </div>


                <div class="profile-field">

                    <label for="property_type">
                        Type *
                    </label>

                    <select
                        id="property_type"
                        name="property_type"
                        required
                    >

                        <option value="">
                            Choisir
                        </option>

                        <option value="Appartement">
                            Appartement
                        </option>

                        <option value="Maison">
                            Maison
                        </option>

                        <option value="Villa">
                            Villa
                        </option>

                        <option value="Studio">
                            Studio
                        </option>

                        <option value="Commerce">
                            Commerce
                        </option>

                        <option value="Bureau">
                            Bureau
                        </option>

                        <option value="Terrain">
                            Terrain
                        </option>

                        <option value="Autre">
                            Autre
                        </option>

                    </select>

                </div>


                <div class="profile-field">

                    <label for="price">
                        Prix / mois (DH) *
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        min="0"
                        step="0.01"
                        placeholder="3500"
                        required
                    >

                </div>


                <div class="profile-field">

                    <label for="city">
                        Ville *
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Agadir"
                        required
                    >

                </div>


                <div class="profile-field">

                    <label for="district">
                        Quartier
                    </label>

                    <input
                        type="text"
                        id="district"
                        name="district"
                        placeholder="Hay Mohammadi"
                    >

                </div>


                <div class="profile-field full">

                    <label for="address">
                        Adresse
                    </label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Adresse du logement"
                    >

                </div>


                <div class="profile-field full">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="6"
                        placeholder="Décrivez votre logement..."
                    ></textarea>

                </div>


                <div class="profile-field">

                    <label for="surface">
                        Surface (m²)
                    </label>

                    <input
                        type="number"
                        id="surface"
                        name="surface"
                        min="1"
                        step="0.01"
                        placeholder="85"
                    >

                </div>


                <div class="profile-field">

                    <label for="bedrooms">
                        Chambres
                    </label>

                    <input
                        type="number"
                        id="bedrooms"
                        name="bedrooms"
                        min="0"
                        value="0"
                    >

                </div>


                <div class="profile-field">

                    <label for="bathrooms">
                        Salles de bain
                    </label>

                    <input
                        type="number"
                        id="bathrooms"
                        name="bathrooms"
                        min="0"
                        value="0"
                    >

                </div>


                <div class="profile-field full">

                    <label>
                        Équipements
                    </label>

                    <div style="
                        display:flex;
                        gap:18px;
                        flex-wrap:wrap;
                        margin-top:10px;
                    ">

                        <label>
                            <input
                                type="checkbox"
                                name="furnished"
                            >
                            Meublé
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="parking"
                            >
                            Parking
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="elevator"
                            >
                            Ascenseur
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="air_conditioning"
                            >
                            Climatisation
                        </label>

                    </div>

                </div>


                <div class="profile-field">

                    <label for="latitude">
                        Latitude
                    </label>

                    <input
                        type="number"
                        id="latitude"
                        name="latitude"
                        step="0.0000001"
                        placeholder="30.4278"
                    >

                </div>


                <div class="profile-field">

                    <label for="longitude">
                        Longitude
                    </label>

                    <input
                        type="number"
                        id="longitude"
                        name="longitude"
                        step="0.0000001"
                        placeholder="-9.5981"
                    >

                </div>


                <button
                    type="submit"
                    class="save-profile"
                >
                    Publier l'annonce
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
