{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4"><i class="fa-solid fa-heart text-danger"></i> Mes Favoris</h2>

<div class="row">
    {% for property in properties %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <img src="{{ property.image_url or 'https://via.placeholder.com/300x200' }}" class="card-img-top" style="height: 200px; object-fit: cover;">
            <div class="card-body">
                <h5 class="card-title">{{ property.title }}</h5>
                <p class="text-muted"><i class="fa-solid fa-location-dot"></i> {{ property.city }}</p>
                <h6 class="text-success fw-bold">{{ property.price }} DH / mois</h6>
            </div>
            <div class="card-footer bg-white border-top-0">
                <button class="btn btn-danger btn-sm w-100" onclick="toggleFavorite({{ property.id }}, this); location.reload();">
                    Supprimer des favoris
                </button>
            </div>
        </div>
    </div>
    {% else %}
    <p class="text-muted">Vous n'avez aucun logement dans vos favoris.</p>
    {% endfor %}
</div>
{% endblock %}
