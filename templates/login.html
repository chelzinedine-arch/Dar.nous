<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — Dar.nous</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-header">

            <a href="/" class="auth-logo">
                Dar<span>.nous</span>
            </a>

            <p>Bienvenue sur Dar.nous</p>

        </div>


        <div class="auth-box">

            <h1>Se connecter</h1>

            <p class="auth-subtitle">
                Connectez-vous pour accéder à votre compte.
            </p>


            {% if message %}
                <div class="auth-message">
                    {{ message }}
                </div>
            {% endif %}


            <form method="POST"
                  action="{{ url_for('login') }}">


                <div class="form-group">

                    <label for="username">
                        Nom d'utilisateur
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Votre nom d'utilisateur"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Votre mot de passe"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Se connecter
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Vous n'avez pas encore de compte ?
                    <a href="{{ url_for('register') }}">
                        Créer un compte
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
