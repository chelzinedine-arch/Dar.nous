<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - Dar.nous</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-header">

            <a href="/" class="auth-logo">
                Dar<span>.nous</span>
            </a>

            <p>Rejoignez Dar.nous</p>

        </div>


        <div class="auth-box">

            <h1>Créer un compte</h1>

            <p class="auth-subtitle">
                Créez votre compte pour commencer à rechercher
                votre prochain logement.
            </p>


            {% if message %}
                <div class="auth-message">
                    {{ message }}
                </div>
            {% endif %}


            <form method="POST"
                  action="{{ url_for('register') }}">


                <div class="form-row">

                    <div class="form-group">

                        <label for="first_name">
                            Prénom
                        </label>

                        <input
                            type="text"
                            id="first_name"
                            name="first_name"
                            placeholder="Votre prénom"
                        >

                    </div>


                    <div class="form-group">

                        <label for="last_name">
                            Nom
                        </label>

                        <input
                            type="text"
                            id="last_name"
                            name="last_name"
                            placeholder="Votre nom"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="username">
                        Nom d'utilisateur
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ex: zinedine123"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Téléphone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="06XXXXXXXX"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 6 caractères"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button">
                    Créer mon compte
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Vous avez déjà un compte ?

                    <a href="{{ url_for('login') }}">
                        Se connecter
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
